.scoreboard{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:76%;display:flex;align-items:center;justify-content:center;gap:3%;text-align:center}
.team{width:32%;display:flex;flex-direction:column;align-items:center;gap:8px}
.logo{width:clamp(45px,10vw,100px);height:clamp(45px,10vw,100px);object-fit:contain;display:none}
.name{display:none!important}
.score{font-size:clamp(36px,7vw,76px);font-weight:900;letter-spacing:2px;text-shadow:0 3px 7px #00105c}
.center{display:flex;flex-direction:column;align-items:center;min-width:20%}
.timer{font-size:clamp(13px,2.2vw,25px);font-weight:bold;margin-top:5px}
.competition{position:absolute;left:50%;top:7%;transform:translateX(-50%);font-size:clamp(12px,2vw,23px);font-weight:800;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 5px #00105c}
.controls{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;background:#00135a99;padding:7px;border-radius:8px}
.controls input{width:100px;max-width:22vw;padding:5px;border:0;border-radius:4px}
.controls button{padding:5px 10px;border:0;border-radius:4px;font-weight:bold;cursor:pointer}\n.toggleControls{position:fixed;right:10px;bottom:10px;z-index:9999;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.28);color:#fff;font-size:16px;line-height:30px;text-align:center;cursor:pointer;opacity:.55;box-shadow:none}.toggleControls:hover{opacity:.9;background:rgba(0,0,0,.55}
@media(max-height:400px){.controls{display:none}}

#teamA,#teamB{display:none!important}
.logo{object-fit:contain}
.board{width:100vw!important;height:100vh!important;min-width:100vw;min-height:100vh;background-position:center;background-repeat:no-repeat;background-size:100% 100%}
.toggleControls{min-width:0!important;max-width:30px!important;flex:none!important}\n</style>
</head>
<body>
<div class="board">
 <div class="competition" id="competition">UEFA CHAMPIONS LEAGUE</div>
 <div class="scoreboard">
  <div class="team"><img class="logo" id="logoA"></div>
  <div class="center"><div class="score"><span id="scoreA">0</span> : <span id="scoreB">0</span></div><div class="timer" id="minute">00:00</div></div>
  <div class="team"><img class="logo" id="logoB"></div>
 </div>
 <div class="controls">
  <input id="a" value="" type="hidden"><input id="b" value="" type="hidden">
  <input id="sa" type="number" min="0" value="0" aria-label="Gol casa"><input id="sb" type="number" min="0" value="0" aria-label="Gol ospiti">
  <input id="m" value="00:00" aria-label="Minuto"><input id="la" placeholder="URL logo casa"><input id="lb" placeholder="URL logo ospiti">
  <button onclick="updateBoard()">AGGIORNA</button>
 </div>
</div>
<button class="toggleControls" id="toggleControls" onclick="toggleControls()" aria-label="Nascondi o mostra controlli" title="Controlli">👁</button>
<script>
function updateBoard(){
 document.getElementById('scoreA').textContent=document.getElementById('sa').value||0;
 document.getElementById('scoreB').textContent=document.getElementById('sb').value||0;
 document.getElementById('minute').textContent=document.getElementById('m').value||'00:00';
 [['la','logoA'],['lb','logoB']].forEach(([input,id])=>{let url=document.getElementById(input).value.trim(),im=document.getElementById(id);if(url){im.src=url;im.style.display='block'}else{im.style.display='none'}});
}
function toggleControls(){
 let c=document.querySelector('.controls'), hidden=c.style.display==='none';
 c.style.display=hidden?'flex':'none';
 document.getElementById('toggleControls').textContent='👁';
}
let elapsed=0;
function startClock(){
 const display=document.getElementById('minute');
 display.textContent='00:00';
 setInterval(()=>{elapsed++;let mm=Math.floor(elapsed/60),ss=elapsed%60;
 display.textContent=String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');},1000);
}
window.addEventListener('load',()=>{updateBoard();startClock();});
</script>
</body></html>
